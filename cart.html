<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Apple Store</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Apple</a>
        <a href="index.html">Continue Shopping</a>
    </nav>

    <main class="cart-container">
        <h1>Your Bag.</h1>
        <p class="subtitle">The best products, just for you.</p>

        <section class="cart-item">
            <div class="product-image">
                <img src="image/iphone.webp" alt="iPhone">
            </div>

            <div class="product-info">
                <h2>iPhone</h2>
                <p>Available in multiple finishes</p>
                <p class="price">₹79,900</p>

                <div class="actions">
                    <button type="button">−</button>
                    <span>1</span>
                    <button type="button">+</button>
                    <button type="button" class="remove">Remove</button>
                </div>
            </div>
        </section>

        <section class="cart-item">
            <div class="product-image">
                <img src="image/Apple-Pencil.jpg" alt="Apple Pencil">
            </div>

            <div class="product-info">
                <h2>Apple Pencil</h2>
                <p>Creativity, made easy.</p>
                <p class="price">₹9,500</p>

                <div class="actions">
                    <button type="button">−</button>
                    <span>1</span>
                    <button type="button">+</button>
                    <button type="button" class="remove">Remove</button>
                </div>
            </div>
        </section>

        <section class="summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal</span>
                <span>₹89,400</span>
            </div>
            <div class="summary-row">
                <span>Delivery</span>
                <span>Free</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span>₹89,400</span>
            </div>

            <a href="checkout.html" class="checkout">Check Out</a>
            
        </section>
    </main>

</body>
</html>
