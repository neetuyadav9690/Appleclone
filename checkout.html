<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Apple Store</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Apple</a>
        <a href="cart.html">← Back to Bag</a>
    </nav>

    <main class="checkout-container">
        <h1>Checkout.</h1>
        <p class="subtitle">Almost yours. Complete your order details.</p>

        <div class="checkout-layout">

            <section class="checkout-form">
                <h2>Delivery Details</h2>

                <form action="#" method="get">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname"
                           placeholder="Enter your full name" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter your phone number" required>

                    <label for="address">Delivery Address</label>
                    <textarea id="address" name="address"
                              placeholder="House number, street, area"
                              rows="3" required></textarea>

                    <label for="city">City</label>
                    <input type="text" id="city" name="city"
                           placeholder="Enter your city" required>

                    <label for="pincode">PIN Code</label>
                    <input type="text" id="pincode" name="pincode"
                           placeholder="6-digit PIN code"
                           pattern="[0-9]{6}" required>

                    <h2 class="payment-heading">Payment Method</h2>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="cod" required>
                        Cash on Delivery
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="upi">
                        UPI
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="card">
                        Credit / Debit Card
                    </label>

                    <button type="submit" class="place-order">
                        Place Order
                    </button>
                </form>
            </section>

            <aside class="order-summary">
                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>iPhone</span>
                    <span>₹79,900</span>
                </div>

                <div class="summary-row">
                    <span>Apple Pencil</span>
                    <span>₹9,500</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span>Free</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span>₹89,400</span>
                </div>

                <p class="secure-note">
                    Your demo checkout details are entered on this page.
                </p>
            </aside>

        </div>
    </main>

</body>
</html>
